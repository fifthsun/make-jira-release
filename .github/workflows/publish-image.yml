name: publish-image

# Builds the action's image once and publishes it to GHCR, so callers pull a
# prebuilt image instead of building the Dockerfile (and pulling python:3-slim
# anonymously) on every release. action.yml pins the published image by digest:
# after this runs, copy the digest from the run summary into action.yml, then tag.

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

concurrency:
  group: "publish-image"
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      packages: "write" # push to ghcr.io/fifthsun/make-jira-release with GITHUB_TOKEN

    steps:
      - name: "Checkout Code"
        id: checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # 7.0.1
        with:
          persist-credentials: false

      - name: "Login to GHCR"
        id: ghcr-login
        uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # 4.6.0
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ github.token }}"

      # sha-<commit> is the immutable tag to reference; main just tracks the latest build.
      - name: "Image Metadata"
        id: meta
        uses: "docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302" # 6.2.0
        with:
          images: "ghcr.io/${{ github.repository }}"
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: "Setup Buildx"
        id: setup-buildx
        uses: "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069" # 4.4.1

      - name: "Build and Push"
        id: build-push
        uses: "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc" # 7.4.0
        with:
          context: "."
          platforms: "linux/amd64" # GitHub-hosted runners only run linux/amd64 container actions
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"

      - name: "Summary"
        id: summary
        env:
          IMAGE: "ghcr.io/${{ github.repository }}"
          DIGEST: "${{ steps.build-push.outputs.digest }}"
        run: |
          {
            echo "### Published image"
            echo
            echo "Pin this in action.yml:"
            echo
            echo '```yaml'
            echo "  image: docker://${IMAGE}@${DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
