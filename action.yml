name: create-jira-release
description: Create a release in Jira using Jira Automation Webhook
author: out-of-mana
inputs:
  webhook-url:
    description: Jira Automation Webhook URL
    required: true
  project: 
    description: The project you're cutting a release for
    default: ${{ github.event.repository.name }}
  release:
    description: Release tag (v1.0.0, 2.3.91, etc)
    default: ${{ github.event.release.tag_name }}
  tickets:
    description: List of Jira tickets to update from MERGED to DEPLOYED
    required: true
runs:
  using: docker
  # Prebuilt by .github/workflows/publish-image.yml (sha-7cbc2e1). Pinned by digest so
  # callers pull a fixed image instead of building the Dockerfile on every run.
  image: docker://ghcr.io/fifthsun/make-jira-release@sha256:76ede3f4dd04534678a4a370812708a2df80f2fa45a93d5e57ef3db18bb60f23
